<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="The Scoreboard" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><clipPath id="r"><rect width="1000" height="76" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#39d0d8" stop-opacity=".28"/><stop offset=".45" stop-color="#161b22"/><stop offset="1" stop-color="#58a6ff" stop-opacity=".16"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#39d0d8"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#39d0d8"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="tg" x1="88" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#39d0d8"/></linearGradient></defs><style>.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}@keyframes ping{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.9);opacity:0}}.in{animation:in .8s cubic-bezier(.2,.8,.2,1) both}@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#r)">
<rect width="1000" height="76" fill="url(#bg)"/>
<rect x="-160" y="0" width="120" height="76" fill="#fff" opacity=".07" transform="skewX(-20)"><animate attributeName="x" values="-160;1100" dur="5.5s" repeatCount="indefinite"/></rect>
<circle cx="46" cy="38" r="22" fill="#39d0d8" opacity=".5" class="ping"/>
<circle cx="46" cy="38" r="23" fill="#0d1117" stroke="#39d0d8" stroke-width="2"/>
<g transform="translate(46 38)"><path d="M-8,9 V1 M0,9 V-9 M8,9 V-4" stroke="#39d0d8" stroke-width="4.5" stroke-linecap="round"/></g>
<text x="88" y="48" font-size="28" font-weight="800" fill="url(#tg)">The Scoreboard</text>
<rect x="819.0" y="20" width="157.0" height="36" rx="18" fill="#39d0d8" fill-opacity=".14" stroke="#39d0d8" stroke-opacity=".7"/>
<text x="897.5" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="#39d0d8">8 pull requests</text>
</g>
<rect x="1" y="1" width="998" height="74" rx="18" fill="none" stroke="url(#bd)" stroke-width="2"/></svg>
