<linearGradient id="bd" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#a371f7"/><stop offset=".5" stop-color="#f778ba"/><stop offset="1" stop-color="#a371f7"/>
