<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="Spotlight: Hardening rippled" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><clipPath id="r"><rect width="1000" height="76" rx="18"/></clipPath>
