<linearGradient id="bg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#e3b341" stop-opacity=".28"/><stop offset=".45" stop-color="#161b22"/><stop offset="1" stop-color="#3fb950" stop-opacity=".16"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#e3b341"/><stop offset=".5" stop-color="#3fb950"/><stop offset="1" stop-color="#e3b341"/>
