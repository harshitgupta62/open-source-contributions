<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="round"><rect width="1200" height="380" rx="22"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".6" stop-color="#0f1a30"/><stop offset="1" stop-color="#1a1035"/></linearGradient>
<linearGradient id="tg" x1="90" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#f778ba"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-280 0;280 0;-280 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 .05 .55 .95;.45 .05 .55 .95" dur="10s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
<linearGradient id="flow" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".33" stop-color="#a371f7"/><stop offset=".66" stop-color="#f778ba"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#30363d"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="44"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="pc0"><rect x="140" y="274" width="316.8" height="40"><animate attributeName="width" values="0;0;316.8;316.8;0;0" keyTimes="0;0.0000;0.1083;0.3000;0.3250;1" dur="12s" repeatCount="indefinite"/></rect></clipPath><clipPath id="pc1"><rect x="140" y="274" width="0" height="40"><animate attributeName="width" values="0;0;230.4;230.4;0;0" keyTimes="0;0.3333;0.4417;0.6333;0.6583;1" dur="12s" repeatCount="indefinite"/></rect></clipPath><clipPath id="pc2"><rect x="140" y="274" width="0" height="40"><animate attributeName="width" values="0;0;432.0;432.0;0;0" keyTimes="0;0.6667;0.7750;0.9667;0.9917;1" dur="12s" repeatCount="indefinite"/></rect></clipPath></defs>
<style>
.tok{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:15px;opacity:0;animation-name:float;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}12%{opacity:.5}80%{opacity:.25}100%{transform:translateY(-420px);opacity:0}}
.in{animation:in .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 3s ease-out infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g clip-path="url(#round)">
<rect width="1200" height="380" fill="url(#bg)"/>
<rect width="1200" height="380" fill="url(#dots)" opacity=".65"/>
<g filter="url(#blur)">
 <circle cx="200" cy="90" r="130" fill="#58a6ff" opacity=".28"><animateTransform attributeName="transform" type="translate" values="0 0;180 50;0 0" dur="15s" repeatCount="indefinite"/></circle>
 <circle cx="1000" cy="300" r="140" fill="#a371f7" opacity=".32"><animateTransform attributeName="transform" type="translate" values="0 0;-160 -60;0 0" dur="18s" repeatCount="indefinite"/></circle>
 <circle cx="620" cy="40" r="95" fill="#f778ba" opacity=".18"><animateTransform attributeName="transform" type="translate" values="0 0;-140 70;0 0" dur="12s" repeatCount="indefinite"/></circle>
 <circle cx="900" cy="80" r="80" fill="#39d0d8" opacity=".14"><animateTransform attributeName="transform" type="translate" values="0 0;60 90;0 0" dur="13s" repeatCount="indefinite"/></circle>
</g>
<rect width="1200" height="2" fill="#fff" opacity=".05"><animate attributeName="y" values="-4;380" dur="7s" repeatCount="indefinite"/></rect>
<text class="tok" x="60" y="400" fill="#58a6ff" style="animation-duration:12s;animation-delay:0s">{ }</text><text class="tok" x="330" y="400" fill="#3fb950" style="animation-duration:13s;animation-delay:4s">isBool()</text><text class="tok" x="520" y="400" fill="#f778ba" style="animation-duration:11s;animation-delay:1.5s">isString()</text><text class="tok" x="700" y="400" fill="#a371f7" style="animation-duration:12s;animation-delay:6s">nullptr</text><text class="tok" x="150" y="400" fill="#e3b341" style="animation-duration:13s;animation-delay:8s">&amp;&amp;</text><text class="tok" x="610" y="400" fill="#39d0d8" style="animation-duration:12s;animation-delay:9.5s">tests</text>
<g class="in" style="animation-delay:.1s">
 <rect x="90" y="106" width="34" height="4" rx="2" fill="url(#flow)"/>
 <text x="134" y="114" font-size="14" letter-spacing="4" fill="#8b949e">OPEN SOURCE ENGINEERING PORTFOLIO</text>
</g>
<text class="in" style="animation-delay:.25s" x="88" y="196" font-size="72" font-weight="800" fill="url(#tg)">Harshit Gupta</text>
<text class="in" style="animation-delay:.45s" x="90" y="238" font-size="22" fill="#c9d1d9">C++  ·  Defensive programming  ·  Input validation</text>
<g class="in" style="animation-delay:.65s">
 <rect x="90" y="266" width="560" height="56" rx="14" fill="#0b1020" fill-opacity=".85" stroke="#30363d"/>
 <text x="110" y="304" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#58a6ff">$</text>
</g>
<text x="140" y="304" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24" fill="#7ee787" textLength="316.8" lengthAdjust="spacingAndGlyphs" clip-path="url(#pc0)">4 pull requests merged</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.1083;0.3000;0.3250;1" dur="12s" repeatCount="indefinite"/><rect y="278" width="11" height="32" fill="#7ee787"><animate attributeName="x" values="140;140;456.8;456.8;456.8;456.8" keyTimes="0;0.0000;0.1083;0.3000;0.3250;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/></rect></g><text x="140" y="304" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24" fill="#7ee787" textLength="230.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#pc1)">2 more in review</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.4417;0.6333;0.6583;1" dur="12s" repeatCount="indefinite"/><rect y="278" width="11" height="32" fill="#7ee787"><animate attributeName="x" values="140;140;370.4;370.4;370.4;370.4" keyTimes="0;0.3333;0.4417;0.6333;0.6583;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/></rect></g><text x="140" y="304" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24" fill="#7ee787" textLength="432.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#pc2)">every rippled fix ships tested</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7750;0.9667;0.9917;1" dur="12s" repeatCount="indefinite"/><rect y="278" width="11" height="32" fill="#7ee787"><animate attributeName="x" values="140;140;572.0;572.0;572.0;572.0" keyTimes="0;0.6667;0.7750;0.9667;0.9917;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/></rect></g>
<g transform="translate(960 190)">
 <circle r="158" fill="none" stroke="#a371f7" stroke-opacity=".3" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="50s" repeatCount="indefinite"/></circle>
 <circle r="112" fill="none" stroke="#30363d" stroke-width="1.5"/>
 <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/><circle cx="0.0" cy="-112.0" r="10" fill="#3fb950"/><circle cx="0.0" cy="-112.0" r="16" fill="#3fb950" opacity=".2"/><circle cx="79.2" cy="-79.2" r="10" fill="#3fb950"/><circle cx="79.2" cy="-79.2" r="16" fill="#3fb950" opacity=".2"/><circle cx="112.0" cy="0.0" r="10" fill="#3fb950"/><circle cx="112.0" cy="0.0" r="16" fill="#3fb950" opacity=".2"/><circle cx="79.2" cy="79.2" r="10" fill="#3fb950"/><circle cx="79.2" cy="79.2" r="16" fill="#3fb950" opacity=".2"/><circle cx="0.0" cy="112.0" r="10" fill="#e3b341"/><circle cx="0.0" cy="112.0" r="16" fill="#e3b341" opacity=".2"/><circle cx="-79.2" cy="79.2" r="10" fill="#e3b341"/><circle cx="-79.2" cy="79.2" r="16" fill="#e3b341" opacity=".2"/><circle cx="-112.0" cy="0.0" r="10" fill="#f85149"/><circle cx="-112.0" cy="0.0" r="16" fill="#f85149" opacity=".2"/><circle cx="-79.2" cy="-79.2" r="10" fill="#f85149"/><circle cx="-79.2" cy="-79.2" r="16" fill="#f85149" opacity=".2"/></g>
 <circle r="62" fill="#a371f7" opacity=".5" class="ping"/>
 <polygon points="62.0,0.0 31.0,53.7 -31.0,53.7 -62.0,0.0 -31.0,-53.7 31.0,-53.7" fill="#161b22" stroke="url(#hg)" stroke-width="3.5" filter="url(#glow)"/>
 <path d="M-24,2 L-8,18 L26,-18" fill="none" stroke="#7ee787" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="0">
  <animate attributeName="stroke-dashoffset" values="90;0;0;90" keyTimes="0;.3;.85;1" dur="5s" repeatCount="indefinite"/></path>
